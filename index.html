<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lakaz Plan">
<meta name="theme-color" content="#0f5d6b">
<title>Lakaz Plan · relevé de bâtiment</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f5d6b'/%3E%3Cpath d='M14 34 32 18l18 16v16H14z' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M28 50V38h8v12' fill='none' stroke='%23f2a541' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{
  --brand:#0f5d6b; --brand2:#0b4652; --accent:#f2a541; --ink:#1d2528; --mut:#5f6d72;
  --bg:#eef2f3; --panel:#ffffff; --line:#d6dfe2; --est:#c45f00; --ok:#1f8a4c; --bad:#c8312b;
  --sel:#0a8ea3;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
/* --- En-tête --- */
header{display:flex;align-items:center;gap:6px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));background:var(--brand);color:#fff;flex-wrap:wrap;position:relative;z-index:5}
.brand{font-weight:700;letter-spacing:.2px;white-space:nowrap;margin-right:4px}
.hbtn{background:rgba(255,255,255,.12);border:0;border-radius:8px;color:#fff;padding:6px 10px;min-height:36px;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.22)}
.pname{max-width:220px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
#lvlSel{background:#fff;color:var(--ink);border:0;border-radius:8px;padding:6px 8px;min-height:36px;max-width:170px}
.tabs{display:flex;background:rgba(0,0,0,.18);border-radius:10px;padding:3px;gap:2px}
.tabs button{background:none;border:0;color:#d8eef1;padding:6px 12px;border-radius:8px;min-height:32px}
.tabs button.on{background:#fff;color:var(--brand);font-weight:600}
.sp{flex:1}
/* --- Zone principale --- */
main{position:relative;display:grid;grid-template-columns:1fr 370px;min-height:0}
#stage{position:relative;overflow:hidden;background:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
#plan{width:100%;height:100%;display:block}
#plan.bgmode #gPlan{pointer-events:none}
#plan.tool-door,#plan.tool-window,#plan.tool-defect,#plan.tool-trace{cursor:crosshair}
#hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(29,37,40,.86);color:#fff;padding:7px 14px;border-radius:20px;font-size:13.5px;pointer-events:none;max-width:90%;text-align:center}
#hint:empty{display:none}
#toolbar{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;width:62px;min-height:54px;border:0;border-radius:10px;background:none;font-size:20px;line-height:1.1;padding:4px 2px}
.tool small{font-size:10.5px;color:var(--mut);margin-top:2px}
.tool:hover{background:var(--bg)}
.tool.on{background:var(--brand);color:#fff}
.tool.on small{color:#cfe9ed}
#zoomCtl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:5px}
#zoomCtl button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px}
#scalebar{position:absolute;left:84px;bottom:10px;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;pointer-events:none}
#sbBar{height:6px;border:1.5px solid #333;border-top:0}
#north{position:absolute;right:12px;bottom:12px;width:44px;height:44px;pointer-events:none}
#empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center}
#empty h3{margin:0 0 6px}
#empty p{margin:0 0 12px;color:var(--mut);font-size:14px}
#empty .row{justify-content:center}
/* --- Panneau latéral --- */
#panel{overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:14px 14px 40px;-webkit-overflow-scrolling:touch}
#panelHandle{display:none}
#panel h3{margin:0 0 8px;font-size:17px}
#panel h4{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.hint{color:var(--mut);font-size:13px;margin:4px 0 8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;min-height:38px}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--brand2)}
.btn.warn{color:var(--bad);border-color:#efc5c2}
.btn.sm{padding:4px 9px;min-height:30px;font-size:13px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:3px 10px;font-size:13px}
.chip:hover,.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.titleIn{font-size:18px;font-weight:700;border:1px solid transparent;border-radius:8px;padding:4px 6px;width:100%;background:var(--bg)}
.titleIn:focus{border-color:var(--brand);outline:0;background:#fff}
.mf{display:grid;grid-template-columns:1fr 92px auto;gap:4px 8px;align-items:center;padding:7px 8px;border-radius:10px;margin-bottom:4px;border:1px solid transparent}
.mf.hl{border-color:var(--bad);background:#fff6f5}
.mf .ml{font-size:14px;font-weight:600}
.mf .ml small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.num{width:92px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:16px;background:#fff}
.num:focus{outline:2px solid var(--sel);border-color:transparent}
.st{font-size:11.5px;border-radius:10px;padding:2px 7px;white-space:nowrap}
.st.ok{background:#e3f4ea;color:var(--ok)}
.st.est{background:#fdf0e3;color:var(--est)}
.field{display:block;margin:8px 0}
.field>span{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;font-size:16px}
.field textarea{min-height:70px;resize:vertical}
.badge{display:inline-block;border-radius:10px;padding:3px 9px;font-size:12.5px;font-weight:600}
.b-ok{background:#e3f4ea;color:var(--ok)}
.b-est{background:#fdf0e3;color:var(--est)}
.b-bad{background:#fde6e4;color:var(--bad)}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff}
.msg{border-radius:10px;padding:8px 10px;font-size:13.5px;margin:8px 0}
.msg.ok{background:#e3f4ea;color:#155f35}
.msg.warn{background:#fdf0e3;color:#7a3c00}
.msg.bad{background:#fde6e4;color:#8a1f1a}
.msg.info{background:#e6f1f3;color:#0b4652}
.schem{background:var(--bg);border-radius:12px;padding:4px;margin:6px 0}
.schem svg{width:100%;height:190px;display:block}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:7px 4px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand);color:#fff}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs .th{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.thumbs .th button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1}
.todo li{margin:4px 0;cursor:pointer}
.todo li:hover{text-decoration:underline}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.kpi div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.kpi b{display:block;font-size:18px}
.kpi span{font-size:11.5px;color:var(--mut)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
/* --- Vues pleine page --- */
#pageView{position:absolute;inset:0;overflow:auto;background:var(--bg);padding:16px;display:none;z-index:3;-webkit-overflow-scrolling:touch}
.wrap{max-width:1100px;margin:0 auto}
table.t{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right;vertical-align:top}
table.t th{background:#f6f8f9;font-size:12.5px;color:var(--mut);font-weight:600}
table.t td:first-child,table.t th:first-child,table.t .l{text-align:left}
table.t tr.tot td{font-weight:700;background:#f6f8f9}
.tblWrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin:8px 0 18px}
.dcard{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;cursor:pointer}
.dnum{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.dcard img{width:70px;height:70px;object-fit:cover;border-radius:8px}
/* --- Rapport / impression --- */
#reportRoot .page{background:#fff;margin:0 auto 18px;box-shadow:0 2px 14px rgba(0,0,0,.12);padding:0;overflow:hidden;color:#111;font-size:10pt}
#reportRoot .pin{padding:0}
.rp-h{display:flex;justify-content:space-between;border-bottom:1.5px solid #111;padding-bottom:2mm;margin-bottom:3mm;font-size:9pt}
.rp-h b{font-size:11pt}
.plan-area{display:flex;align-items:center;justify-content:center;overflow:hidden}
.cart{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;border:1.2px solid #111;font-size:8.5pt;height:28mm}
.cart>div{padding:1.5mm 2.5mm;border-right:1px solid #111;overflow:hidden}
.cart>div:last-child{border-right:0;display:flex;gap:3mm;align-items:center}
.cart b{font-size:10.5pt}
.rp-t{width:100%;border-collapse:collapse;font-size:8.5pt}
.rp-t th,.rp-t td{border:0.6px solid #999;padding:1.2mm 1.6mm;text-align:right;vertical-align:top}
.rp-t th{background:#eee}
.rp-t td.l,.rp-t th.l{text-align:left}
.rp-t tr{break-inside:avoid}
.rp-t img{height:28mm;max-width:40mm;object-fit:cover;margin:0 1mm 1mm 0}
.rp-sec{margin:0 0 5mm}
.rp-sec h2{font-size:12pt;margin:0 0 2mm}
.flow{padding:0}
@media screen{#reportRoot .page{padding:10mm!important;box-sizing:content-box}#reportRoot{overflow-x:auto}}
/* --- Modale, menu, toast --- */
#modal{position:fixed;inset:0;background:rgba(10,20,24,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.hidden,#menuPop.hidden{display:none}
.mbox{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:90vh;max-height:90dvh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mbox h2{margin:0 0 10px}
.mbox .close{float:right;border:0;background:var(--bg);border-radius:50%;width:34px;height:34px;font-size:16px}
#menuPop{position:fixed;top:52px;right:10px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:40;padding:6px;min-width:250px}
#menuPop button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px}
#menuPop button:hover{background:var(--bg)}
#menuPop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1d2528;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:70;display:flex;align-items:center;justify-content:center}
#viewer img{max-width:96%;max-height:96%}
/* --- Mobile --- */
@media (max-width:820px){
  header{gap:5px;padding:5px 8px}
  .brand,.redo,.lbl{display:none}
  .pname{flex:1;min-width:0;max-width:none}
  #lvlSel{max-width:118px}
  .hbtn{padding:6px 9px}
  .tabs{order:10;width:100%;justify-content:space-between}
  .tabs button{flex:1;padding:6px 4px;font-size:13.5px}
  main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #panel{border-left:0;border-top:1px solid var(--line);max-height:46vh;max-height:46dvh;padding-top:4px;box-shadow:0 -6px 20px rgba(0,0,0,.08);z-index:4}
  #panel.closed{max-height:52px;overflow:hidden}
  #panelHandle{display:block;width:100%;border:0;background:none;padding:6px 0 8px;color:var(--mut);font-size:13px}
  #panelHandle::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:#c5d0d3;margin:0 auto 4px}
  #toolbar{flex-direction:row;left:8px;right:8px;top:auto;bottom:8px;transform:none;overflow-x:auto;padding:3px;gap:1px}
  .tool{flex:1 1 0;width:auto;min-width:40px;min-height:50px;font-size:18px;padding:3px 0}
  .tool small{font-size:9.5px}
  #scalebar{left:10px;bottom:74px}
  #north{bottom:74px}
  #empty{top:40%}
  #reportRoot{zoom:.42}
}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  #app,main,#pageView{display:block!important;position:static!important;height:auto!important;overflow:visible!important;padding:0!important;background:#fff!important}
  header,#stage,#panel,.noprint,#toast,#modal,#menuPop{display:none!important}
  #reportRoot .page{box-shadow:none;margin:0;break-after:page;page-break-after:always}
  #reportRoot .page:last-child{break-after:auto;page-break-after:auto}
}
</style>
<style id="pageStyle"></style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">🏝️ <b>Lakaz Plan</b></div>
    <button class="hbtn pname" id="pname" data-act="projInfo" title="Informations du projet"></button>
    <select id="lvlSel" data-in="level" title="Niveau"></select>
    <button class="hbtn" data-act="addLevel" title="Ajouter un niveau (étage)">＋<span class="lbl"> Niveau</span></button>
    <nav class="tabs" id="tabs">
      <button data-act="tab" data-v="plan">Plan</button>
      <button data-act="tab" data-v="metres">Métrés</button>
      <button data-act="tab" data-v="desordres">Désordres</button>
      <button data-act="tab" data-v="rapport">Rapport PDF</button>
    </nav>
    <div class="sp"></div>
    <button class="hbtn" data-act="undo" title="Annuler (Ctrl+Z)">↶</button>
    <button class="hbtn redo" data-act="redo" title="Rétablir (Ctrl+Y)">↷</button>
    <button class="hbtn" data-act="menu" id="menuBtn">☰<span class="lbl"> Menu</span></button>
  </header>
  <main id="main">
    <div id="stage">
      <svg id="plan" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="gridS" width="0.1" height="0.1" patternUnits="userSpaceOnUse"><path id="gridSp" d="M0.1 0H0V0.1" fill="none" stroke="#eef3f4"/></pattern>
          <pattern id="gridL" width="1" height="1" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="url(#gridS)"/><path id="gridLp" d="M1 0H0V1" fill="none" stroke="#d3dde0"/></pattern>
        </defs>
        <rect id="gridRect" fill="url(#gridL)"/>
        <image id="bgImg" data-kind="bg" preserveAspectRatio="none" display="none"/>
        <g id="gPlan"></g>
      </svg>
      <div id="hint"></div>
      <div id="scalebar"><div id="sbBar"></div><span id="sbTxt"></span></div>
      <svg id="north" viewBox="-22 -22 44 44"><circle r="20" fill="#fff" stroke="#9aa9ad"/><g id="northG"><path d="M0-7 5 12 0 8-5 12Z" fill="#1d2528"/><text y="-12" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#1d2528">N</text></g></svg>
      <div id="toolbar">
        <button class="tool" data-act="tool" data-v="select" title="Sélectionner et déplacer">✋<small>Déplacer</small></button>
        <button class="tool" data-act="tool" data-v="room" title="Ajouter une pièce">➕<small>Pièce</small></button>
        <button class="tool" data-act="tool" data-v="trace" title="Tracer une pièce point par point">✏️<small>Tracer</small></button>
        <button class="tool" data-act="tool" data-v="door" title="Placer une porte">🚪<small>Porte</small></button>
        <button class="tool" data-act="tool" data-v="window" title="Placer une fenêtre">🪟<small>Fenêtre</small></button>
        <button class="tool" data-act="tool" data-v="defect" title="Signaler un désordre">⚠️<small>Désordre</small></button>
        <button class="tool" data-act="tool" data-v="bg" title="Photo ou croquis en fond">🖼️<small>Fond</small></button>
        <button class="tool" data-act="tool" data-v="ai" title="Analyse automatique par IA">✨<small>IA</small></button>
      </div>
      <div id="zoomCtl">
        <button data-act="zoomIn" title="Zoom avant">＋</button>
        <button data-act="zoomOut" title="Zoom arrière">－</button>
        <button data-act="fit" title="Tout afficher">⤢</button>
      </div>
      <div id="empty"></div>
    </div>
    <aside id="panel"><button id="panelHandle" data-act="panelToggle"></button><div id="panelBody"></div></aside>
    <section id="pageView"></section>
  </main>
</div>
<div id="modal" class="hidden"><div class="mbox" id="mbox"></div></div>
<div id="menuPop" class="hidden"></div>
<div id="toast"></div>
<input type="file" id="fileIn" hidden>

<script>
'use strict';
/* =====================================================================
   Lakaz Plan : relevé de bâtiments existants (plans cotés, désordres, métrés)
   Fichier unique, sans dépendance, fonctionne hors ligne.
   Unités internes : mètres. Repère écran : x vers la droite, y vers le bas.
   ===================================================================== */

// ---------- Utilitaires ----------
const $ = (s, el = document) => el.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const f4 = n => +(+n).toFixed(4);
const fmt = (v, d = 2) => (v == null || isNaN(v)) ? '–' : (+v).toFixed(d).replace('.', ',');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const letter = i => String.fromCharCode(65 + i);
function parseNum(s) { s = String(s ?? '').trim().replace(/\s/g, '').replace(',', '.'); return s ? parseFloat(s) : NaN; }
const V = {
  add: (a, b) => ({ x: a.x + b.x, y: a.y + b.y }), sub: (a, b) => ({ x: a.x - b.x, y: a.y - b.y }),
  mul: (a, k) => ({ x: a.x * k, y: a.y * k }), dot: (a, b) => a.x * b.x + a.y * b.y,
  cross: (a, b) => a.x * b.y - a.y * b.x, len: a => Math.hypot(a.x, a.y),
  dist: (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
  norm: a => { const l = Math.hypot(a.x, a.y) || 1; return { x: a.x / l, y: a.y / l }; },
  rot: (a, deg) => { const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); return { x: a.x * c - a.y * s, y: a.x * s + a.y * c }; },
};
const pt = p => f4(p.x) + ' ' + f4(p.y);
const pstr = P => P.map(p => f4(p.x) + ',' + f4(p.y)).join(' ');
function area(P) { let s = 0; for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length]; s += a.x * b.y - b.x * a.y; } return s / 2; }
function perimeter(P) { let s = 0; for (let i = 0; i < P.length; i++) s += V.dist(P[i], P[(i + 1) % P.length]); return s; }
function centroid(P) {
  const A = area(P); if (Math.abs(A) < 1e-9) return V.mul(P.reduce((s, p) => V.add(s, p), { x: 0, y: 0 }), 1 / P.length);

// Résolution géométrique d'une pièce à partir des mesures (triangulation en éventail depuis le coin 1)
function solveRoom(r) {

    const L = Math.max(0.05, r.rect.L.v), W = Math.max(0.05, r.rect.W.v);
    const pts = [{ x: 0, y: 0 }, { x: L, y: 0 }, { x: L, y: W }, { x: 0, y: W }];
    let ctrl = null; if (r.rect.D.m && r.rect.D.v > 0) { const e = Math.hypot(L, W); ctrl = { meas: r.rect.D.v, exp: e, diff: r.rect.D.v - e }; }

  const P = [{ x: 0, y: 0 }, { x: s[0], y: 0 }]; let err = null;

    const dd = V.dist(A, B) || 1e-9, ex = V.mul(V.sub(B, A), 1 / dd), a = (r0 * r0 - r1 * r1 + dd * dd) / (2 * dd);
    let h2 = r0 * r0 - a * a;

      if (!err && Math.sqrt(-h2) > 0.02) err = `Triangle impossible entre les coins 1, ${k} et ${k + 1} : vérifiez ${k <= n - 2 ? 'la diagonale d' + (k - 1) : 'le mur ' + letter(n - 1)} et le mur ${letter(k - 1)} (un côté est plus long que la somme des deux autres).`;
      h2 = 0;

    const h = Math.sqrt(h2);

  return { pts: P, err, ctrl };
}

function measList(r) {

// ---------- Stockage local (IndexedDB, repli mémoire) ----------
const DB = {
  db: null, mem: new Map(),
  open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open('lakaz-plan', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('projects', { keyPath: 'id' });
        rq.onsuccess = () => { this.db = rq.result; res(true); };
        rq.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  tx(mode) { return this.db.transaction('projects', mode).objectStore('projects'); },
  req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  put(p) { if (!this.db) { this.mem.set(p.id, JSON.parse(JSON.stringify(p))); return Promise.resolve(); } return this.req(this.tx('readwrite').put(p)); },
  get(id) { if (!this.db) return Promise.resolve(this.mem.get(id)); return this.req(this.tx('readonly').get(id)); },
  all() { if (!this.db) return Promise.resolve([...this.mem.values()]); return this.req(this.tx('readonly').getAll()); },
  del(id) { if (!this.db) { this.mem.delete(id); return Promise.resolve(); } return this.req(this.tx('readwrite').delete(id)); },
};

    const type = app.tool === 'door' ? 'porte' : 'fenetre', T0 = OPEN_T[type], ww = Math.min(T0.w, hit.len * 0.9);

    mutate(() => hit.r.openings.push(op));

function renderPanel() {

// --- Panneau : résumé du niveau et liste des choses à faire
function overviewPanel() {
  const L = lvl(), P = app.project; let A = 0, ok = 0, tot = 0; const todo = [];
  L.rooms.forEach(r => {
    const m = roomMetrics(r), pr = precision(r); A += m.A; ok += pr.ok; tot += pr.tot;
    if (m.err) todo.push(`<li data-act="selRoom" data-id="${r.id}">⚠️ <b>${esc(r.name)}</b> : mesures incohérentes</li>`);
    else if (pr.ok < pr.tot) todo.push(`<li data-act="selRoom" data-id="${r.id}">📏 <b>${esc(r.name)}</b> : ${pr.tot - pr.ok} cote(s) à mesurer</li>`);
    if (m.ctrl && Math.abs(m.ctrl.diff) > 0.05) todo.push(`<li data-act="selRoom" data-id="${r.id}">📐 <b>${esc(r.name)}</b> : contrôle hors tolérance (${fmt(Math.abs(m.ctrl.diff) * 100, 0)} cm)</li>`);
    if (!r.h.m) todo.push(`<li data-act="selRoom" data-id="${r.id}">↕️ <b>${esc(r.name)}</b> : hauteur sous plafond à mesurer</li>`);

  const pct = tot ? Math.round(ok / tot * 100) : 0;

  ${todo.length ? `<h4>À faire</h4><ul class="todo">${todo.slice(0, 14).join('')}</ul>` : (L.rooms.length ? '<div class="msg ok">Toutes les pièces sont mesurées. ✓</div>' : '')}
  <h4>Méthode conseillée</h4>
  <ol class="hint" style="padding-left:18px">
    <li><b>Ébauche</b> : ajoutez les pièces (➕), tracez-les sur un croquis (🖼️ puis ✏️) ou laissez l'IA lire le croquis (✨).</li>

function schematic(r) {
  const g = solveRoom(r), P = g.pts.map(p => V.rot(p, r.rot)), n = P.length, b = bbox(P);
  const Wd = 320, Hd = 190, pad = 30, k = Math.min((Wd - 2 * pad) / Math.max(0.1, b.maxx - b.minx), (Hd - 2 * pad) / Math.max(0.1, b.maxy - b.miny));
  const ox = (Wd - (b.maxx - b.minx) * k) / 2, oy = (Hd - (b.maxy - b.miny) * k) / 2;
  const S = p => ({ x: ox + (p.x - b.minx) * k, y: oy + (p.y - b.miny) * k }), Q = P.map(S), hl = app.hl;
  let s = `<svg viewBox="0 0 ${Wd} ${Hd}"><polygon points="${pstr(Q)}" fill="#fff" stroke="none"/>`;
  const seg = (a, c, key, col, dash, label, lpos) => {
    const on = hl === key; s += `<line x1="${f4(a.x)}" y1="${f4(a.y)}" x2="${f4(c.x)}" y2="${f4(c.y)}" stroke="${on ? '#e0322b' : col}" stroke-width="${on ? 5 : dash ? 1.6 : 3}" ${dash && !on ? 'stroke-dasharray="5 4"' : ''} stroke-linecap="round"/>`;
    if (label) s += `<text x="${f4(lpos.x)}" y="${f4(lpos.y)}" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="${on ? '#e0322b' : col}" ${FONT}>${label}</text>`;
  };
  if (r.mode === 'rect') {
    seg(Q[0], Q[2], 'D', '#1f8a4c', true, 'diag.', V.add(V.mul(V.add(Q[0], Q[2]), 0.5), { x: 0, y: -9 }));
  } else {
    const at = (a, c, k) => V.add(a, V.mul(V.sub(c, a), k));
    r.poly.diags.forEach((_, i) => seg(Q[0], Q[i + 2], 'd' + i, '#2c6fbb', true, 'd' + (i + 1), at(Q[0], Q[i + 2], 0.7)));
    if (n === 4) seg(Q[1], Q[3], 'c', '#1f8a4c', true, 'ctrl', at(Q[1], Q[3], 0.28));
  }
  for (let i = 0; i < n; i++) {
    const a = Q[i], c = Q[(i + 1) % n], d = V.norm(V.sub(c, a)), no = { x: d.y, y: -d.x }, lp = V.add(V.mul(V.add(a, c), 0.5), V.mul(no, 13));
    const key = r.mode === 'rect' ? (i % 2 ? 'W' : 'L') : 's' + i, faded = r.mode === 'rect' && i >= 2;
    seg(a, c, key, faded ? '#9aa9ad' : '#1d2528', false, letter(i) + (faded ? (i === 2 ? '=A' : '=B') : ''), lp);
  }
  Q.forEach((p, i) => { s += `<circle cx="${f4(p.x)}" cy="${f4(p.y)}" r="9" fill="#0a8ea3"/><text x="${f4(p.x)}" y="${f4(p.y)}" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central" ${FONT}>${i + 1}</text>`; });
  return s + '</svg>';
}

// ---------- Vues Métrés / Désordres / Rapport ----------
function metresTable(L, cls = 't') {
  let T = { A: 0, P: 0, wg: 0, op: 0, wn: 0, pl: 0, v: 0 };
  const rows = L.rooms.map(r => {
    const m = roomMetrics(r); T.A += m.A; T.P += m.P; T.wg += m.wallGross; T.op += m.opA; T.wn += m.wallNet; T.pl += m.plinthe; T.v += m.vol;
    return `<tr><td class="l">${esc(r.name)}</td><td>${fmt(m.A)}</td><td>${fmt(m.P)}</td><td>${fmt(r.h.v)}</td><td>${fmt(m.wallGross)}</td><td>${fmt(m.opA)}</td><td>${fmt(m.wallNet)}</td><td>${fmt(m.plinthe)}</td><td>${fmt(m.vol, 1)}</td><td>${m.est ? '≈ ' + m.est : '✓'}</td></tr>`;
  }).join('');
  return { T, html: `<table class="${cls}"><thead><tr><th class="l">Pièce</th><th>Sol / plafond m²</th><th>Périmètre m</th><th>HSP m</th><th>Murs bruts m²</th><th>Ouvertures m²</th><th>Murs nets m²</th><th>Plinthes ml</th><th>Volume m³</th><th>Cotes estimées</th></tr></thead>
  <tbody>${rows}<tr class="tot"><td class="l">Total ${esc(L.name)}</td><td>${fmt(T.A)}</td><td>${fmt(T.P)}</td><td></td><td>${fmt(T.wg)}</td><td>${fmt(T.op)}</td><td>${fmt(T.wn)}</td><td>${fmt(T.pl)}</td><td>${fmt(T.v, 1)}</td><td></td></tr></tbody></table>` };
}
function openingsSummary(L) {
  const g = {}; L.rooms.forEach(r => r.openings.forEach(o => { const k = OPEN_T[o.type].l + ' ' + fmt(o.w) + ' × ' + fmt(o.h); g[k] = (g[k] || 0) + 1; }));
  const e = Object.entries(g); return e.length ? e.map(([k, n]) => `${n} × ${k} m`).join(' · ') : 'Aucune ouverture saisie.';
}
function renderMetres() {
  const P = app.project; let gA = 0;
  let h = `<div class="wrap"><div class="row" style="justify-content:space-between"><h2 style="margin:4px 0">Métrés et quantitatifs</h2><button class="btn pri" data-act="exportCSV">⬇︎ Exporter pour Excel (CSV)</button></div>
  <p class="hint">Calculés à partir des cotes du plan. Murs nets = murs bruts − ouvertures (portes et fenêtres de la pièce). Plinthes = périmètre − largeur des portes. Les valeurs issues de cotes ≈ sont à confirmer avant de commander des matériaux.</p>`;
  P.levels.forEach(L => { const m = metresTable(L); gA += m.T.A; h += `<h3>${esc(L.name)}</h3><div class="tblWrap">${m.html}</div><p class="hint">Ouvertures : ${openingsSummary(L)}</p>`; });
  h += `<div class="msg info">Surface totale tous niveaux : <b>${fmt(gA)} m²</b> (surface intérieure, murs exclus).</div></div>`;
  $('#pageView').innerHTML = h;
}

function paperDims(o) { const D = { A4: [297, 210], A3: [420, 297] }[o.paper]; return o.orient === 'landscape' ? D : [D[1], D[0]]; }
function scaleBar(scale) {
  const Lm = [0.5, 1, 2, 5, 10, 20, 50, 100].find(l => l * 1000 / scale >= 25) || 100, mm = Lm * 1000 / scale;
  let s = `<svg width="${f4(mm + 8)}mm" height="9mm" viewBox="-4 0 ${f4(mm + 8)} 9">`;
  for (let i = 0; i < 4; i++) s += `<rect x="${f4(i * mm / 4)}" y="1" width="${f4(mm / 4)}" height="2" fill="${i % 2 ? '#fff' : '#111'}" stroke="#111" stroke-width="0.25"/>`;
  return s + `<text x="0" y="7" font-size="2.6" text-anchor="middle" ${FONT}>0</text><text x="${f4(mm)}" y="7" font-size="2.6" text-anchor="middle" ${FONT}>${String(Lm).replace('.', ',')} m</text></svg>`;
}
function northSvg(deg) { return `<svg width="13mm" height="13mm" viewBox="-22 -22 44 44"><circle r="20" fill="none" stroke="#111" stroke-width="1"/><g transform="rotate(${deg || 0})"><path d="M0-7 5 12 0 8-5 12Z" fill="#111"/><text y="-12" font-size="10" text-anchor="middle" dominant-baseline="central" font-weight="700" ${FONT} fill="#111">N</text></g></svg>`; }
function buildReport() {
  const P = app.project, o = app.rep, [pw, ph] = paperDims(o), cw = pw - 20, ch = ph - 20, nums = defectNumbers();
  $('#pageStyle').textContent = `@page{size:${o.paper} ${o.orient};margin:10mm}`;
  const today = new Date().toLocaleDateString('fr-FR');
  const head = t => `<div class="rp-h"><span><b>${esc(P.name)}</b>${P.address ? ' · ' + esc(P.address) : ''}</span><span>${esc(t)}</span></div>`;
  let pages = '';
  // Page de synthèse
  let req = 0, ok = 0, totA = 0, nd = 0; P.levels.forEach(L => { L.rooms.forEach(r => { const pr = precision(r); req += pr.tot; ok += pr.ok; totA += roomMetrics(r).A; }); nd += L.defects.length; });
  const cnt = s => P.levels.reduce((n, L) => n + L.defects.filter(d => d.sev == s).length, 0);
  pages += `<section class="page" style="width:${cw}mm;min-height:${ch - 1}mm;padding:0">${head('Synthèse du relevé')}
    <h1 style="font-size:20pt;margin:6mm 0 2mm">${esc(P.name)}</h1>
    <p style="margin:0 0 5mm">${esc(P.address)}${P.client ? ' · Propriétaire / client : ' + esc(P.client) : ''}<br>Relevé du ${esc(P.date)} par ${esc(P.author || '—')} · Rapport édité le ${today}</p>
    <table class="rp-t" style="width:auto;margin-bottom:5mm"><tr><th class="l">Niveaux</th><td>${P.levels.length}</td></tr><tr><th class="l">Pièces</th><td>${P.levels.reduce((n, L) => n + L.rooms.length, 0)}</td></tr>
    <tr><th class="l">Surface intérieure totale</th><td>${fmt(totA)} m²</td></tr><tr><th class="l">Cotes mesurées sur site</th><td>${ok} / ${req} (${req ? Math.round(ok / req * 100) : 0} %)</td></tr>
    <tr><th class="l">Désordres</th><td>${nd} : ${Object.entries(SEV).reverse().map(([k, s]) => `${cnt(k)} ${s.l.toLowerCase()}`).join(', ')}</td></tr></table>
    <div class="rp-sec"><h2>Méthode et précision</h2><p style="margin:0">Relevé de l'état existant. Chaque pièce est mesurée par triangulation (murs et diagonales) au télémètre laser ou au mètre ruban ; les plans sont reconstitués à partir de ces mesures. Les cotes précédées de « ≈ » sont des estimations (lecture de croquis, de photo ou analyse automatique) et doivent être vérifiées sur site avant toute commande ou tout dimensionnement. Murs dessinés à l'épaisseur indiquée pour chaque pièce. Cotes en mètres.</p></div>
    ${P.notes ? `<div class="rp-sec"><h2>Observations générales</h2><p style="margin:0;white-space:pre-wrap">${esc(P.notes)}</p></div>` : ''}
  </section>`;
  // Plans
  if (o.plans) P.levels.forEach(L => {
    if (!L.rooms.length && !L.defects.length) return;
    const avW = cw, avH = ch - 4 - 8 - 30, pts = levelBBoxPts(L);
    const b0 = bbox(pts); let scale = null, bb = null;
    const fitFor = s => { const m = 48 * 0.25 * s / 1000; const B = { x: b0.minx - m, y: b0.miny - m, w: (b0.maxx - b0.minx) + 2 * m, h: (b0.maxy - b0.miny) + 2 * m }; return { B, ok: B.w * 1000 / s <= avW && B.h * 1000 / s <= avH }; };
    if (o.scale === 'auto') { for (const s of SCALES) { const f = fitFor(s); if (f.ok) { scale = s; bb = f.B; break; } } if (!scale) { scale = 1000; bb = fitFor(1000).B; } }
    else { scale = +o.scale; bb = fitFor(scale).B; }
    const tooBig = !fitFor(scale).ok, u = 0.25 * scale / 1000;
    const plan = `<svg xmlns="http://www.w3.org/2000/svg" width="${f4(bb.w * 1000 / scale)}mm" height="${f4(bb.h * 1000 / scale)}mm" viewBox="${f4(bb.x)} ${f4(bb.y)} ${f4(bb.w)} ${f4(bb.h)}">${svgPlan(L, { u, print: true, dims: true })}</svg>`;
    pages += `<section class="page" style="width:${cw}mm;height:${ch - 1}mm">${head('Plan · ' + L.name)}
      <div class="plan-area" style="height:${avH}mm">${plan}</div>
      <div class="cart"><div><b>${esc(P.name)}</b><br>${esc(P.address)}<br>${P.client ? 'Client : ' + esc(P.client) : ''}</div>
      <div>Relevé de l'existant<br><b>${esc(L.name)}</b><br>Échelle <b>1:${scale}</b>${tooBig ? ' <span style="color:#c00">(dépasse la feuille)</span>' : ''}</div>
      <div>Date : ${esc(P.date)}<br>Auteur : ${esc(P.author || '—')}<br><span style="color:#c45f00">≈ cote estimée, à vérifier</span></div>
      <div>${northSvg(P.north)}${scaleBar(scale)}</div></div></section>`;
  });
  // Métrés
  if (o.metres) {
    let t = ''; P.levels.forEach(L => { if (!L.rooms.length) return; t += `<div class="rp-sec"><h2>${esc(L.name)}</h2>${metresTable(L, 'rp-t').html}<p style="margin:1.5mm 0 0;font-size:8.5pt">Ouvertures : ${openingsSummary(L)}</p></div>`; });
    if (t) pages += `<section class="page flow" style="width:${cw}mm">${head('Métrés')}${t}<p style="font-size:8pt;color:#555">Murs nets = murs bruts − ouvertures. Plinthes = périmètre − largeur des portes. HSP = hauteur sous plafond.</p></section>`;
  }
  // Désordres
  if (o.desordres && nd) {
    const all = []; P.levels.forEach(L => L.defects.forEach(d => all.push({ d, L })));
    all.sort((a, b) => b.d.sev - a.d.sev || nums.get(a.d.id) - nums.get(b.d.id));
    pages += `<section class="page flow" style="width:${cw}mm">${head('Relevé des désordres')}<table class="rp-t"><thead><tr><th>N°</th><th class="l">Niveau</th><th class="l">Type</th><th class="l">Gravité</th><th class="l">Constat</th><th class="l">Travaux préconisés</th><th>Qté</th>${o.photos ? '<th class="l">Photos</th>' : ''}</tr></thead><tbody>
    ${all.map(({ d, L }) => `<tr><td><b>${nums.get(d.id)}</b></td><td class="l">${esc(L.name)}</td><td class="l">${CATS[d.cat].l}</td><td class="l"><span style="color:${SEV[d.sev].c};font-weight:700">● ${SEV[d.sev].l}</span></td><td class="l">${esc(d.desc)}</td><td class="l">${esc(d.action)}</td><td>${esc(d.qty)} ${d.qty ? esc(d.unit) : ''}</td>${o.photos ? `<td class="l">${d.photos.filter(id => P.photos[id]).slice(0, 3).map(id => `<img src="${P.photos[id]}">`).join('')}</td>` : ''}</tr>`).join('')}
    </tbody></table></section>`;
  }
  return pages;
}

const AI_SYSTEM = `Tu es géomètre-expert et architecte spécialisé dans la réhabilitation de bâtiments anciens aux Seychelles (climat tropical humide, air salin, constructions en blocs de béton, béton armé, toitures en tôle sur charpente bois, termites fréquents).

Règles pour les pièces (seulement si l'image montre un plan ou un croquis lisible) :
- Coordonnées en mètres, x vers la droite, y vers le bas, origine en haut à gauche du bâtiment.
- Chaque pièce = polygone des faces intérieures des murs, sommets dans l'ordre du contour. Entre deux pièces voisines, laisse l'épaisseur du mur (environ 0,20 m) ; ne superpose jamais deux pièces.

- Noms en français courant : Salon, Chambre 1, Cuisine, Salle d'eau, WC, Varangue, Couloir...

Règles pour les désordres (photos surtout) : liste uniquement ce qui est réellement visible (fissures, éclatement du béton et fers rouillés, traces d'humidité, moisissures, tôles corrodées, bois attaqué, installations dangereuses...). Gravité : 1 à surveiller, 2 à réparer, 3 urgent, 4 danger pour les personnes. Préconise des travaux concrets adaptés au climat local, en une ou deux phrases simples.

N'invente rien : si tu n'es pas sûr, dis-le dans "remarques" et donne des conseils de mesure sur site. Écris pour un public non spécialiste.`;
async function callClaude(images, hintText) {

  };

    if (res.status === 429) throw new Error('Trop de requêtes ou crédit épuisé. Réessayez dans une minute ou vérifiez votre crédit sur console.anthropic.com.');
    if (res.status >= 500) throw new Error('Le service est momentanément surchargé. Réessayez dans quelques instants.');
    throw new Error('Erreur ' + res.status + ' : ' + m);
  }
  if (data.stop_reason === 'refusal') throw new Error('L\'analyse a été refusée pour ces images. Essayez avec une autre image.');
  if (data.stop_reason === 'max_tokens') throw new Error('Réponse trop longue : essayez avec moins d\'images à la fois.');

  let out; try { out = JSON.parse(txt); } catch (e) { throw new Error('Réponse illisible. Relancez l\'analyse.'); }
  out.pieces = (out.pieces || []).filter(p => p.sommets && p.sommets.length >= 3);

async function aiRun() {

function aiApply() {
  const R = app.ai.result, L = lvl(); if (!R) return;
  pushUndo();
  // pièces : on garde la disposition relative proposée et on place l'ensemble à côté de l'existant
  const allP = R.pieces.flatMap(p => p.sommets);
  const spot = freeSpot(L), b = allP.length ? bbox(allP) : { minx: 0, miny: 0 }, sh = p => ({ x: p.x - b.minx + spot.x, y: p.y - b.miny + spot.y });
  const newIds = [];
  R.pieces.forEach(p => {
    const pts = p.sommets.map(sh), r = roomFromPts(p.nom || 'Pièce', pts);
    p.ouvertures.forEach(o => {
      const n = pts.length, A = pts[((o.mur % n) + n) % n], B = pts[(((o.mur + 1) % n) + n) % n], d = V.norm(V.sub(B, A)), S = V.add(A, V.mul(d, Math.max(0, o.position))), E = V.add(S, V.mul(d, o.largeur || OPEN_T[o.type].w));
      attachOpeningWorld(r, o.type, S, E);
    });
    L.rooms.push(r); newIds.push(r.id);

  const pb = levelBBoxPts(L), bb = pb.length ? bbox(pb) : { maxx: 0, miny: 0 };
  let photoId = null;
  if (R.desordres.length && app.ai.files[0]) { photoId = uid(); app.project.photos[photoId] = app.ai.files[0].data; }
  R.desordres.forEach((d, i) => L.defects.push({ id: uid(), x: bb.maxx + 1.5, y: bb.miny + 0.5 + i * 0.9, cat: CATS[d.categorie] ? d.categorie : 'autre', sev: clamp(d.gravite | 0, 1, 4), desc: d.description, action: d.action, qty: '', unit: 'm²', photos: photoId ? [photoId] : [], place: true, date: new Date().toISOString().slice(0, 10) }));
  app.ai.result = null; app.ai.files = [];

  toast(`${R.pieces.length} pièce(s) et ${R.desordres.length} désordre(s) ajoutés. Toutes les cotes sont ≈ : mesurez-les sur place.`);
}

function readImage(file, maxDim = 1600, q = 0.82) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight; const k = Math.min(1, maxDim / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res({ data: c.toDataURL('image/jpeg', q), w, h });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Image illisible (format non pris en charge ? Essayez JPEG ou PNG).')); };
    img.src = url;
  });
}

const ACT = {
  tab: el => { $('#menuPop').classList.add('hidden'); app.tab = el.dataset.v; ui(); if (app.tab === 'plan') requestAnimationFrame(() => { updateViewBox(); draw(); }); },
  tool: el => { closeModal(); if (app.tab !== 'plan') { app.tab = 'plan'; } setTool(el.dataset.v); },
  undo, redo, menu, help: () => { $('#menuPop').classList.add('hidden'); helpModal(); },
  projects: () => { $('#menuPop').classList.add('hidden'); projectsModal(); },
  projInfo: () => { $('#menuPop').classList.add('hidden'); projInfoModal(); },
  settings: () => { $('#menuPop').classList.add('hidden'); settingsModal(); },
  closeModal, zoomIn: () => zoomAt(1.3), zoomOut: () => zoomAt(1 / 1.3), fit: fitView,
  panelToggle: () => { app.panelOpen = !app.panelOpen; renderPanel(); },
  cancelPanel: () => { app.panelMode = null; ui(); },
  addLevel: () => { const n = prompt('Nom du nouveau niveau :', 'Étage ' + app.project.levels.length); if (!n) return; mutate(() => { app.project.levels.push(newLevel(n)); app.levelIdx = app.project.levels.length - 1; app.sel = null; }); fitView(); },
  delLevel: el => { const i = +el.dataset.i, L = app.project.levels[i]; if (!confirm(`Supprimer le niveau « ${L.name} » et tout son contenu ?`)) return; mutate(() => { app.project.levels.splice(i, 1); app.levelIdx = 0; app.sel = null; }); projInfoModal(); },
  newRoomName: el => { $('#newRoomName').value = el.dataset.v + ' ' + (lvl().rooms.length + 1); },
  createRoom: el => {
    const name = ($('#newRoomName').value || 'Pièce').trim(), r = templateRoom(el.dataset.v, name);
    placeRoom(r, freeSpot(lvl())); app.panelMode = null; mutate(() => lvl().rooms.push(r));
    selectObj({ kind: 'room', id: r.id }); fitView();
    setTimeout(() => { const i = $('#panelBody input.num'); if (i && window.innerWidth > 820) i.focus(); }, 50);
  },
  selRoom: el => { if (app.tab !== 'plan') { app.tab = 'plan'; ui(); } selectObj({ kind: 'room', id: el.dataset.id }); },
  selDefect: el => selectObj({ kind: 'defect', id: el.dataset.id }),
  selOpening: el => selectObj({ kind: 'opening', id: el.dataset.id }),
  setRoomName: el => { const r = selObj(); mutate(() => { const same = lvl().rooms.filter(x => x !== r && x.name.startsWith(el.dataset.v)).length; r.name = el.dataset.v + (['Chambre', 'Salle d\'eau', 'WC'].includes(el.dataset.v) && same ? ' ' + (same + 1) : ''); }); },
  rot: el => { const r = selObj(); mutate(() => rotateRoom(r, +el.dataset.v), false); },
  toPoly: () => { const r = selObj(); mutate(() => rectToPoly(r)); toast('Mesurez maintenant les 4 murs et la diagonale d1.'); },
  toRect: () => { const r = selObj(); if (!confirm('Revenir au rectangle ? Seuls les murs A et B seront conservés.')) return; mutate(() => { r.rect = { L: r.poly.sides[0], W: r.poly.sides[1], D: M(0) }; r.mode = 'rect'; r.poly = null; }); },
  dupRoom: () => { const r = selObj(), c = JSON.parse(JSON.stringify(r)); c.id = uid(); c.name = r.name + ' (copie)'; c.openings.forEach(o => o.id = uid()); placeRoom(c, freeSpot(lvl())); mutate(() => lvl().rooms.push(c)); selectObj({ kind: 'room', id: c.id }); },
  delRoom: () => { const r = selObj(); if (!confirm(`Supprimer « ${r.name} » ?`)) return; mutate(() => { lvl().rooms = lvl().rooms.filter(x => x !== r); app.sel = null; }); },
  addOpening: el => {
    const r = selObj(), type = el.dataset.v, T0 = OPEN_T[type], W = worldPts(r), L0 = V.dist(W[0], W[1]), w = Math.min(T0.w, L0 * 0.9);
    const op = { id: uid(), type, wall: 0, off: r2((L0 - w) / 2), w, h: T0.h, sill: T0.sill, swing: 'in', hinge: 'L' };
    mutate(() => r.openings.push(op)); selectObj({ kind: 'opening', id: op.id });
  },
  opType: el => { const { o } = selObj(), T0 = OPEN_T[el.dataset.v]; mutate(() => { o.type = el.dataset.v; o.h = T0.h; o.sill = T0.sill; if (el.dataset.v === 'baie' && o.w < 1.2) o.w = T0.w; }); },
  opSet: el => { const { o } = selObj(); mutate(() => { o[el.dataset.k] = el.dataset.v; }); },
  delOpening: () => { const { r, o } = selObj(); mutate(() => { r.openings = r.openings.filter(x => x !== o); app.sel = { kind: 'room', id: r.id }; }); },
  dfSev: el => { const d = selObj(); mutate(() => { d.sev = +el.dataset.v; }); },
  delDefect: () => { const d = selObj(); if (!confirm('Supprimer ce désordre ?')) return; mutate(() => { lvl().defects = lvl().defects.filter(x => x !== d); app.sel = null; }); },
  addDefectPhoto: () => pickFile('defectPhoto', 'image/*', true),
  delPhoto: el => { const d = selObj(); mutate(() => { d.photos = d.photos.filter(id => id !== el.dataset.id); }); },
  viewPhoto: el => viewPhoto(app.project.photos[el.dataset.id]),
  gotoDefect: el => { app.levelIdx = +el.dataset.li; app.tab = 'plan'; app.tool = 'select'; ui(); selectObj({ kind: 'defect', id: el.dataset.id }); },
  finishTrace, traceUndo: () => { app.trace.pts.pop(); draw(); renderPanel(); },
  importBg: () => pickFile('bg', 'image/*'),
  calib: () => { app.calib = { pts: [], hover: null }; hint(); toast('Touchez 2 points sur l\'image dont vous connaissez la distance réelle.'); if (window.innerWidth <= 820) { app.panelOpen = false; renderPanel(); } },
  delBg: () => { if (!confirm('Retirer l\'image de fond ?')) return; mutate(() => { lvl().bg = null; }); },
  saveKey: () => { const k = $('#keyIn').value.trim(); if (!k.startsWith('sk-')) return toast('Clé invalide : elle commence par sk-ant-'); app.settings.apiKey = k; LS.set('settings', app.settings); renderPanel(); toast('Clé enregistrée sur cet appareil.'); },
  forgetKey: () => { if (!confirm('Effacer la clé API de cet appareil ?')) return; app.settings.apiKey = ''; LS.set('settings', app.settings); renderPanel(); },
  saveSettings: () => { app.settings.apiKey = $('#keyIn2').value.trim(); app.settings.model = $('#modelIn').value; LS.set('settings', app.settings); closeModal(); toast('Réglages enregistrés.'); if (app.tool === 'ai') renderPanel(); },
  aiAddFile: () => pickFile('ai', 'image/*', true),
  aiDelFile: el => { app.ai.files.splice(+el.dataset.v, 1); renderPanel(); },
  aiRun, aiApply, aiClear: () => { app.ai.result = null; app.ai.err = null; renderPanel(); },
  exportProject: () => { $('#menuPop').classList.add('hidden'); exportProject(); },
  importProject: () => { $('#menuPop').classList.add('hidden'); closeModal(); pickFile('project', '.json,application/json'); },
  exportCSV: () => { $('#menuPop').classList.add('hidden'); exportCSV(); },
  exportSVG: () => { $('#menuPop').classList.add('hidden'); exportSVG(); },
  print: () => { renderReportView(); setTimeout(() => window.print(), 300); },
  newProject: async () => { const n = prompt('Nom du nouveau relevé :', 'Relevé ' + new Date().toLocaleDateString('fr-FR')); if (!n) return; const P = newProject(n); await DB.put(P); closeModal(); openProject(P); },
  openProj: async el => { const P = await DB.get(el.dataset.id); closeModal(); if (P) openProject(P); },
  delProj: async el => {
    const P = await DB.get(el.dataset.id); if (!P || !confirm(`Supprimer définitivement « ${P.name} » de cet appareil ?\n(Pensez à sauvegarder le fichier projet avant.)`)) return;
    await DB.del(P.id);
    if (P.id === app.project.id) { const rest = (await DB.all()).sort((a, b) => b.updated - a.updated); const next = rest[0] || newProject(); if (!rest[0]) await DB.put(next); openProject(next); }
    projectsModal();
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});

// ---------- Saisies (champs) ----------
document.addEventListener('focusin', e => {
  const el = e.target.closest('[data-in]'); if (!el) return; app.pendingSnap = snap();
  if (el.dataset.in === 'meas') { app.hl = el.dataset.k; document.querySelectorAll('.mf').forEach(m => m.classList.toggle('hl', m.dataset.key === app.hl)); const sc = $('#schem'); if (sc) sc.innerHTML = schematic(selObj()); draw(); }
});
document.addEventListener('focusout', e => {
  const el = e.target.closest('[data-in="meas"]'); if (!el) return;
  setTimeout(() => { if (!document.activeElement || !document.activeElement.closest('[data-in="meas"]')) { app.hl = null; document.querySelectorAll('.mf.hl').forEach(m => m.classList.remove('hl')); const sc = $('#schem'), r = selObj(); if (sc && r && app.sel.kind === 'room') sc.innerHTML = schematic(r); draw(); } }, 10);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-in]'); if (!el) return;
  if (app.pendingSnap && app.pendingSnap !== snap()) pushUndo(app.pendingSnap); app.pendingSnap = null;
  const k = el.dataset.in;
  if (k === 'level') { app.levelIdx = +el.value; app.sel = null; app.trace = null; ui(); fitView(); }
  if (['op', 'df', 'bg', 'bgShow', 'traceOrtho', 'rep', 'aiModel', 'lvlName'].includes(k)) onInput(el, true);
  if (k === 'meas' || k === 'roomT') { const r = selObj(); if (r) { const i = el.dataset.k && getMeas(r, el.dataset.k); if (i && i.v > 0) el.value = fmt(i.v); } }
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && el.tagName !== 'SELECT' && el.type !== 'checkbox') onInput(el, false); });
let cmWarned = false;
function onInput(el, committed) {
  const k = el.dataset.in, key = el.dataset.k;
  if (k === 'meas') {
    const r = selObj(), o = getMeas(r, key); if (!o) return;
    let v = parseNum(el.value);
    if (el.value.trim() === '') { o.m = false; }
    else if (v > 0) {
      if (v > 60 && key !== 'h') { v = v / 100; if (!cmWarned) { toast('Valeur lue en centimètres : ' + fmt(v) + ' m'); cmWarned = true; } }
      if (key === 'h' && v > 12) v = v / 100;
      o.v = v; o.m = true;
    } else return;
    const st = document.querySelector(`[data-st="${key}"]`); if (st) { st.className = 'st ' + (o.m ? 'ok' : 'est'); st.textContent = o.m ? '✓ mesuré' : (o.v > 0 ? '≈ estimé' : 'à mesurer'); }
    $('#roomDerived').innerHTML = roomDerived(r); const sc = $('#schem'); if (sc) sc.innerHTML = schematic(r);
    save(); draw(); return;
  }
  if (k === 'roomName') { const r = selObj(); r.name = el.value; $('#panelHandle').textContent = r.name; save(); draw(); return; }
  if (k === 'roomT') { const r = selObj(), v = parseNum(el.value); if (v > 0 && v < 1.5) { r.t = v; save(); draw(); } return; }
  if (k === 'op') {
    const { r, o } = selObj(); if (key === 'wall') { o.wall = +el.value; o.off = 0; save(); draw(); if (committed) renderPanel(); return; }
    const v = parseNum(el.value); if (!(v >= 0)) return; o[key] = v; save(); draw(); return;
  }
  if (k === 'df') { const d = selObj(); d[key] = el.value; save(); if (committed && key === 'cat') renderPanel(); return; }
  if (k === 'bg') { const b = lvl().bg; const v = parseNum(el.value); if (!(v > -1000)) return; if (key === 'w') { if (v > 0) b.w = v; } else b[key] = v; renderBg(); save(); if (committed) renderPanel(); return; }
  if (k === 'bgShow') { lvl().bg.show = el.checked; renderBg(); save(); draw(); return; }
  if (k === 'traceOrtho') { app.trace.ortho = el.checked; return; }
  if (k === 'aiHint') { app.ai.hint = el.value; return; }
  if (k === 'aiModel') { app.settings.model = el.value; LS.set('settings', app.settings); return; }
  if (k === 'rep') { app.rep[key] = el.type === 'checkbox' ? el.checked : el.value; renderReportView(); return; }
  if (k === 'proj') { const P = app.project; P[key] = key === 'north' ? +el.value : el.value; save(); ui(); if (key === 'north') { const s = el.closest('.field').querySelector('span'); s.textContent = `Orientation du nord : ${P.north}° (aidez-vous de la boussole du téléphone)`; } return; }
  if (k === 'lvlName') { app.project.levels[+el.dataset.i].name = el.value; save(); ui(); return; }
}

// ---------- Clavier ----------
document.addEventListener('keydown', e => {
  const typing = e.target.closest('input,textarea,select');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y' && !typing) { e.preventDefault(); redo(); return; }
  if (typing) { if (e.key === 'Enter' && e.target.matches('input.num')) { const all = [...document.querySelectorAll('#panelBody input.num')], i = all.indexOf(e.target); if (all[i + 1]) all[i + 1].focus(); else e.target.blur(); e.preventDefault(); } return; }
  if (e.key === 'Escape') { if (!$('#modal').classList.contains('hidden')) return closeModal(); if (app.calib) { app.calib = null; hint(); draw(); return; } if (app.trace && app.trace.pts.length) { app.trace.pts.pop(); draw(); renderPanel(); return; } setTool('select'); selectObj(null); }
  if (e.key === 'Enter' && app.trace) finishTrace();
  if ((e.key === 'Delete' || e.key === 'Backspace') && app.sel) { e.preventDefault(); ({ room: ACT.delRoom, defect: ACT.delDefect, opening: ACT.delOpening })[app.sel.kind](); }
});
window.addEventListener('resize', () => { updateViewBox(); draw(); });
window.addEventListener('beforeprint', () => { if (app.tab !== 'rapport') { app.tab = 'rapport'; ui(); } });

// ---------- Démarrage ----------
(async function init() {
  const ok = await DB.open();
  if (!ok) setTimeout(() => toast('Stockage local indisponible : sauvegardez le fichier projet avant de fermer la page.'), 800);
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
  let P = null; const last = LS.get('last', null);
  if (last) P = await DB.get(last);
  if (!P) { const all = await DB.all(); P = all.sort((a, b) => b.updated - a.updated)[0]; }
  const first = !P;
  if (!P) { P = newProject('Mon premier relevé'); await DB.put(P); }
  openProject(P);
  if (first) helpModal();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
})();
</script>
</body>
</html>
